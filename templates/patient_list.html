{% extends "base.html" %}
{% block content %}
<div class="card-header">
    <div class="page-heading">Patients</div>
    <div>
        <a class="btn btn-primary" href="{{ url_for('add_patient') }}">Add Patient</a>
    </div>
</div>
<div class="table-card">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        {% if patients %}
            {% for p in patients %}
            <tr>
                <td>{{ p[0] }}</td>
                <td>{{ p[1] }}</td>
                <td>{{ p[2] }}</td>
                <td>{{ p[3] }}</td>
                <td>{{ p[4] }}</td>
                <td>
                    <div class="action-buttons">
                        <a class="btn btn-ghost btn-sm" href="{{ url_for('patient_history', pid=p[0]) }}" title="View patient history">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12h18m-9-9v18"/>
                            </svg>
                            History
                        </a>
                        <a class="btn btn-ghost btn-sm" href="{{ url_for('edit_patient', pid=p[0]) }}" title="Edit patient details">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                            Edit
                        </a>
                        <form method="post" action="{{ url_for('delete_patient', pid=p[0]) }}" style="display:inline-block; margin:0;">
                            <button class="btn btn-ghost btn-sm" type="submit" onclick="return confirm('Are you sure you want to delete {{ p[1] }}? This action cannot be undone.');" title="Delete patient record">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3,6 5,6 21,6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                                Delete
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            {% endfor %}
        {% else %}
        <tr>
            <td class="table-empty" colspan="6">No patients recorded yet.</td>
        </tr>
        {% endif %}
        </tbody>
    </table>
</div>
{% endblock %}
